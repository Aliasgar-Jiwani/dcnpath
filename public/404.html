<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DCNPath — Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts path to hash-based path if accessed directly
      (function() {
        var pathSegmentsToKeep = 1; // 1 for repo path e.g. /dcnpath/
        var l = window.location;
        var pathname = l.pathname;
        var pathArray = pathname.split('/').filter(Boolean);
        var repoName = pathArray.length > 0 ? pathArray[0] : '';
        
        // If repoName is dcnpath, redirect to /dcnpath/#/<rest_of_path>
        if (repoName.toLowerCase() === 'dcnpath') {
          var restOfPath = pathArray.slice(1).join('/');
          var search = l.search ? l.search : '';
          var hash = l.hash ? l.hash : '';
          var target = '/' + repoName + '/#/' + restOfPath + search + hash;
          l.replace(target);
        } else {
          // Fallback redirect to origin
          l.replace('/' + (repoName ? repoName + '/' : ''));
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0; URL='./'" />
    <style>
      body {
        margin: 0;
        background: #0b0f1a;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>Redirecting to DCNPath...</h2>
      <p>If you are not redirected automatically, <a href="./">click here</a>.</p>
    </div>
  </body>
</html>
