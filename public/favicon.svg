<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid dots -->
  <circle cx="16" cy="16" r="1.5" fill="#334155" />
  <circle cx="32" cy="16" r="1.5" fill="#334155" />
  <circle cx="48" cy="16" r="1.5" fill="#334155" />
  <circle cx="16" cy="32" r="1.5" fill="#334155" />
  <circle cx="48" cy="32" r="1.5" fill="#334155" />
  <circle cx="16" cy="48" r="1.5" fill="#334155" />
  <circle cx="32" cy="48" r="1.5" fill="#334155" />
  <circle cx="48" cy="48" r="1.5" fill="#334155" />

  <!-- DCN Network Path & Waveform Symbol -->
  <!-- Network connecting lines -->
  <path d="M18 42 L26 22 L38 38 L48 24" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Network Nodes -->
  <circle cx="18" cy="42" r="4.5" fill="#020617" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="26" cy="22" r="4.5" fill="#020617" stroke="#60a5fa" stroke-width="2.5" />
  <circle cx="38" cy="38" r="4.5" fill="#020617" stroke="#818cf8" stroke-width="2.5" />
  <circle cx="48" cy="24" r="5" fill="#020617" stroke="#a855f7" stroke-width="2.5" />
  <circle cx="48" cy="24" r="2" fill="#38bdf8" />
</svg>
