<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DCNPath — Interactive learning platform for Data Communication and Networks (SMC3TE105)" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>DCNPath — Data Communication &amp; Networks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Prevent flash of wrong theme — runs before React mounts
      (function() {
        try {
          var stored = localStorage.getItem('dcnpath-theme');
          var theme = stored ? JSON.parse(stored) : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#0b0f1a' : '#f8f9fc';
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Critical inline styles to prevent layout flash */
      html { background-color: #0b0f1a; }
      html[data-theme="light"] { background-color: #f8f9fc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
